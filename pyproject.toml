[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safetensors2verilog"
version = "0"
description = "Compile safetensors-stored networks to synthesis-ready Verilog."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Charles Norton"}]
keywords = [
    "verilog",
    "fpga",
    "safetensors",
    "neural-network",
    "compiler",
    "synthesis",
    "threshold-logic",
    "bitnet",
    "eda",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "torch>=2.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "numpy>=1.23",  # safetensors.torch.save_file uses numpy under the hood
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "numpy>=1.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "onnx>=1.14",
]
onnx = [
    "onnx>=1.14",
]

[project.scripts]
safetensors2verilog = "safetensors2verilog.cli:main"

[project.urls]
Homepage = "https://github.com/CharlesCNorton/safetensors2verilog"
Issues = "https://github.com/CharlesCNorton/safetensors2verilog/issues"

[tool.setuptools.packages.find]
include = ["safetensors2verilog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length is enforced loosely
    "E741",  # ambiguous-name; we use 'l' for lines in test parsing
    "B008",  # default arg call (we don't have those)
    "B905",  # zip() without strict=; lengths are explicitly validated upstream
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
