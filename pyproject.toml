[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safetensors2verilog"
version = "0.2.0"
description = "Compile safetensors-stored networks to synthesis-ready Verilog."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Charles Norton"}]
keywords = [
    "verilog",
    "fpga",
    "safetensors",
    "neural-network",
    "compiler",
    "synthesis",
    "threshold-logic",
    "bitnet",
    "eda",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "torch>=2.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
safetensors2verilog = "safetensors2verilog.cli:main"

[project.urls]
Homepage = "https://github.com/CharlesCNorton/safetensors2verilog"
Issues = "https://github.com/CharlesCNorton/safetensors2verilog/issues"

[tool.setuptools.packages.find]
include = ["safetensors2verilog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
