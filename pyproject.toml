[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safetensors2verilog"
version = "0.1.0"
description = "Compile safetensors-stored networks to synthesis-ready Verilog"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Charles Norton"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "torch>=2.0",
    "safetensors>=0.4",
]

[project.scripts]
safetensors2verilog = "safetensors2verilog.cli:main"

[project.urls]
Homepage = "https://github.com/CharlesCNorton/safetensors2verilog"

[tool.setuptools.packages.find]
include = ["safetensors2verilog*"]
